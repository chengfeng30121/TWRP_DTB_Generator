name: Generate TWRP Device Tree

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'URL to recovery/boot image'
        required: true
        default: 'https://raw.githubusercontent.com/chengfeng30121/TWRP_DTB_Generator/refs/heads/main/recovery.img'

jobs:
  generate-device-tree:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip cpio wget zip
        sudo apt-get install -y lz4 xz-utils lzop brotli unzip
        
    - name: Install TWRP generator (latest)
      run: |
        pip3 install --upgrade twrpdtgen
        wget -O magiskboot "https://github.com/Uevo001/magiskboot-linux/raw/refs/heads/main/x86_64/magiskboot"
        chmod 777 magiskboot
        sudo mv magiskboot /bin
        
    - name: Download recovery image
      run: |
        wget -O recovery.img "${{ github.event.inputs.IMG_URL }}"
        file recovery.img || true
        
    - name: Generate device tree
      run: |
        export LANG=C LC_ALL=C
        AIK_FILE=$(python3 -c "import sebaubuntu_libs.libaik; print(sebaubuntu_libs.libaik.__file__)")
        # sed -i 's/encoding="utf-8"/encoding="utf-8", errors="replace"/' "$AIK_FILE"
        # sed -i 's|f"AIK extraction failed, return code {returncode}"|f"AIK extraction failed, return code {returncode}, content {output[-1000:]}"|g' "$AIK_FILE"
        # sed -i 's|https://github.com/SebaUbuntu/AIK-Linux-mirror|https://github.com/maximus-sallam/android-image-kitchen-complete.git|g' "$AIK_FILE"
        cp libaik.py "$AIK_FILE"
        mkdir -p device_tree_output
        python3 -m twrpdtgen -o device_tree_output recovery.img -d
        
    - name: Compress device tree
      run: |
        cd device_tree_output
        zip -r ../DeviceTree_${{ github.run_number }}.zip .
        cd ..
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: DeviceTree_${{ github.run_number }}.zip
        name: TWRP_Device_Tree_${{ github.run_number }}
        tag_name: dt-${{ github.run_number }}
        body: |
          Automatically generated TWRP device tree
          Build run: ${{ github.run_number }}
          Source image: ${{ github.event.inputs.IMG_URL }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
